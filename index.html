<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produção de Obra — SAVA Construtora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEC; --surface:#FFFFFF; --sunk:#F5F6F4; --ink:#18202B; --muted:#5B6573; --line:#D3D8D2;
  --navy:#1E3F8F; --navy-soft:#E3E9F6; --amber:#9A6A06; --amber-soft:#FBF0D6;
  --green:#2D7A4C; --green-soft:#E1F1E7; --red:#B3261E; --red-soft:#F8E1DF;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A2028; --sunk:#151A21; --ink:#E6E9ED; --muted:#98A2AF; --line:#2C3440;
  --navy:#8FAEF2; --navy-soft:#1F2B44; --amber:#E8B44A; --amber-soft:#3A2F14;
  --green:#6BC28F; --green-soft:#16301F; --red:#EF7A72; --red-soft:#3A1A18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2028; --sunk:#151A21; --ink:#E6E9ED; --muted:#98A2AF; --line:#2C3440;
  --navy:#8FAEF2; --navy-soft:#1F2B44; --amber:#E8B44A; --amber-soft:#3A2F14;
  --green:#6BC28F; --green-soft:#16301F; --red:#EF7A72; --red-soft:#3A1A18;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:28px;line-height:1.1}
h2{font-size:22px;margin-bottom:4px}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;font-size:13px;font-family:ui-monospace,Consolas,monospace}
input[type=number]{text-align:right}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] button.pri{color:#0E1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#0E1420}}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--red)}
button.link{background:none;border:none;color:var(--navy);padding:0;font-weight:600}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:3px solid var(--ink)}
.top .id p{font-size:14px;margin-top:2px}
.obrabar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.obrabar select{font-weight:600;max-width:320px}
.status{font-size:12px;color:var(--muted);min-height:16px;margin-top:6px;text-align:right}

/* parâmetros */
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.params label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.params input,.params select{font-size:15px;color:var(--ink)}
.params .wide{grid-column:span 2}
@media (max-width:520px){.params .wide{grid-column:span 1}}

/* abas */
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:16px 0 18px;border-bottom:1px solid var(--line)}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--muted);white-space:nowrap;font-family:var(--cond);font-size:17px;font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy)}

.section-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.section-head p{max-width:72ch}
.tools{display:flex;flex-wrap:wrap;gap:8px}

/* tabelas */
.scroll{overflow:auto;max-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;background:var(--sunk);position:sticky;top:0;z-index:2;white-space:nowrap;box-shadow:inset 0 -1px 0 var(--line)}
th.num{text-align:right}
tbody tr:hover td{background:var(--sunk)}
td input{width:100%}
td input.n{width:92px}
td input.n-s{width:66px}
td select{max-width:150px}
td.svc{min-width:300px}
td.svc input{font-weight:600}
td.calc{font-weight:600}
td.key{background:var(--navy-soft);font-weight:700;color:var(--navy)}
tbody tr:hover td.key{background:var(--navy-soft)}
tfoot td{font-weight:700;background:var(--sunk);border-bottom:none;position:sticky;bottom:0;z-index:2;box-shadow:inset 0 1px 0 var(--line)}
.stick{position:sticky;left:0;z-index:1;background:var(--surface)}
th.stick{z-index:3;background:var(--sunk)}
tbody tr:hover td.stick{background:var(--sunk)}
.over td.stick{background:var(--red-soft)}
.filtros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-bottom:10px}
.filtros label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.filtros .busca{flex:1 1 240px}.filtros .busca input{width:100%}
.filtros .cont{font-size:13px;color:var(--muted);padding-bottom:7px}
.sub{display:block;font-size:11px;color:var(--muted);font-weight:500}

.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.A{background:var(--red-soft);color:var(--red)}
.chip.B{background:var(--amber-soft);color:var(--amber)}
.chip.C{background:var(--green-soft);color:var(--green)}

.empty{padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.empty p{margin-bottom:12px}

/* medição — o "holerite" */
.medbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.medbar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.ledger{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media (min-width:980px){.ledger{grid-template-columns:1.35fr 1fr}}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.gauge .big{font-family:var(--cond);font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.gauge .row:last-child{border-bottom:none}
.bar{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:12px 0 4px;position:relative;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.slip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:6px;padding:12px 14px}
.slip.low{border-left-color:var(--amber)}
.slip h3{font-size:19px}
.slip .fn{font-size:13px;color:var(--muted);margin-bottom:8px}
.slip .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0;font-variant-numeric:tabular-nums}
.slip .pay{font-family:var(--cond);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--navy)}
.slip input{width:70px;padding:2px 6px}
.note{font-size:13px;background:var(--amber-soft);color:var(--ink);border-radius:6px;padding:8px 10px;margin-top:10px}
.note.bad{background:var(--red-soft)}
.over td{background:var(--red-soft)!important}

.grid2{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h3{margin-bottom:6px}
.card p{margin-bottom:10px}
.abc-bar{height:8px;background:var(--navy);border-radius:4px;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0}
.legend div{font-variant-numeric:tabular-nums}
.legend b{font-family:var(--cond);font-size:22px;display:block}
ol.howto{padding-left:20px;margin:6px 0 0}
ol.howto li{margin-bottom:4px}
.quick{display:grid;grid-template-columns:2.4fr .6fr 1fr 1fr auto;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.quick>*{min-width:0}
.quick input{width:100%}
.quick label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:700px){.quick{grid-template-columns:1fr 1fr}.quick label:first-child{grid-column:span 2}}
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.obra{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--navy);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.obra.sel{border-top-color:var(--green)}
.obra h3{font-size:21px}
.obra .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding:3px 0}
.obra .pct{font-family:var(--cond);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.metas{display:flex;flex-direction:column;gap:16px}
.meta{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:6px;padding:14px 16px}
.meta.late{border-left-color:var(--red)}.meta.done{border-left-color:var(--green)}.meta.eval{border-left-color:var(--amber)}
.meta-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
.meta-head label,.crit label,.pesos label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.meta-head .nm{flex:1 1 260px}.meta-head .nm input{font-weight:700;font-size:17px;width:100%}
.meta-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:980px){.meta-grid{grid-template-columns:1.3fr 1fr}}
.meta h4{font-family:var(--cond);font-size:16px;margin:0 0 6px}
.team{display:flex;flex-direction:column;gap:4px}
.team .p{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
.team .p label{display:flex;align-items:center;gap:8px;flex-direction:row;color:var(--ink);font-size:14px;font-weight:500}
.team input[type=text]{width:60px;padding:2px 6px}
.crit{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.crit .c{display:flex;flex-direction:row;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.prize{font-family:var(--cond);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--navy)}
.pesos{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.pesos input{width:80px}
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.mode>div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px}
.mode>div.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.mode b{font-family:var(--cond);font-size:17px;display:block}
.tema{display:inline-flex;align-items:center;gap:6px}
.tema svg{width:16px;height:16px}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted);cursor:not-allowed;opacity:.85}
.login{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:8px;padding:26px 24px}
.login h1{margin-bottom:4px}.login p{margin-bottom:16px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
.login input{font-size:16px;padding:9px 10px}
.login .erro{background:var(--red-soft);color:var(--red);border-radius:6px;padding:8px 10px;font-size:14px;margin-bottom:12px}
.user{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.user .chip{background:var(--navy-soft);color:var(--navy)}
.uform{display:grid;grid-template-columns:1.6fr 1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}
.uform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:760px){.uform{grid-template-columns:1fr 1fr}}
details.obsel summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:13px}
details.obsel label{display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:8px;padding:26px 16px;text-align:center;cursor:pointer;margin:10px 0;background:var(--sunk)}
.drop.on,.drop:hover{border-color:var(--navy);background:var(--navy-soft)}
.drop b{font-family:var(--cond);font-size:19px}
/* (etapa 2 abaixo) */
/* ===== layout v2: barra, cabeçalho da obra, KPIs, gaveta ===== */
.wrap{max-width:none;padding:0}
.page{max-width:1280px;margin:0 auto;padding:18px 20px 56px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.bar-in{max-width:1280px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 14px/1 var(--cond);letter-spacing:.04em;flex:none}
:root[data-theme="dark"] .logo{color:#0E1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:#0E1420}}
.brand-t{font:700 19px/1 var(--cond);white-space:nowrap}
.grupos{display:flex;gap:4px;margin:0 auto;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.grupos button{display:flex;align-items:center;gap:7px;border:none;background:none;border-radius:7px;padding:7px 14px;color:var(--muted);font:600 16px/1 var(--cond)}
.grupos button svg{width:18px;height:18px}
.grupos button[aria-current="page"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar-dir{display:flex;align-items:center;gap:6px;flex:none}
button.icon{display:inline-grid;place-items:center;width:38px;height:38px;padding:0;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--ink)}
button.icon:hover{background:var(--sunk);border-color:var(--line)}
button.icon svg{width:19px;height:19px}
button.icon.sm{width:32px;height:32px;border-color:var(--line)}
button.danger{color:var(--red);border-color:var(--red)}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer}.menu summary::-webkit-details-marker{display:none}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font:700 14px/1 var(--body)}
.menu-pop{position:absolute;right:0;top:44px;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40}
.eyebrow{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.obra-head{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:18px}
.obra-head>*,.oh-id{min-width:0}
.oh-sel{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:0}
.oh-sel select.obra-select{flex:0 1 auto;min-width:0;width:auto}
select.obra-select{font:700 26px/1.15 var(--cond);border:none;background:transparent;padding:2px 26px 2px 0;max-width:100%;min-width:0;text-overflow:ellipsis;cursor:pointer;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:right 9px center,right 3px center;background-size:6px 6px;background-repeat:no-repeat}
select.obra-select:focus-visible{outline:2px solid var(--navy);border-radius:6px}
.oh-meta{font-size:13px;color:var(--muted);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.k-l{font-size:12px;color:var(--muted);font-weight:600}
.k-v{font:700 25px/1.1 var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-s{font-size:12px;color:var(--muted)}
.k-bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.k-bar i{display:block;height:100%}
.pg-head{margin-bottom:6px}
nav.subtabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.subtabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);white-space:nowrap;font:600 17px/1 var(--cond)}
nav.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy)}
.empty.big{margin-top:10vh;padding:44px 24px}.empty.big h2{margin-bottom:6px}
/* gaveta de configurações */
body.travado{overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:51;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.25);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:entra .18s ease-out}
@keyframes entra{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:22px;margin-top:4px}
.dr-body{overflow:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:6px}
.dr-body fieldset{border:none;border-bottom:1px solid var(--line);margin:0;padding:12px 0 16px;display:flex;flex-direction:column;gap:10px}
.dr-body fieldset:last-child{border-bottom:none}
.dr-body legend{font:700 16px/1 var(--cond);padding:0;margin-bottom:10px}
.dr-body label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.dr-body input,.dr-body select{font-size:15px;color:var(--ink);padding:8px 10px;width:100%;min-width:0}
.dr-grid>label{min-width:0}
.drawer{overflow-x:hidden}

function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}

function persist(id){
  dirty[id]=true; clearTimeout(timers[id]);

}
async function flush(id){
  if(!fs)return;
  if(inflight[id]){again[id]=true;return}
  inflight[id]=true;
  const o=S.obras[id], sv=svDe(id), ref=fs.collection(OBRAS).doc(id);
  try{
    if(!o){
      const b=fs.batch();
      Object.keys(sv.med).forEach(k=>b.delete(ref.collection('medicoes').doc(k)));
      Object.keys(sv.meta).forEach(k=>b.delete(ref.collection('metas').doc(k)));
      b.delete(ref); await b.commit();
      (subs[id]||[]).forEach(f=>f()); delete subs[id]; delete saved[id];
    }else{
      const p=partes(o), b=fs.batch(), depois=[]; let n=0;
      const bj=stable(p.base);
      if(bj!==sv.base&&can('base')){b.set(ref,limpo(p.base));depois.push(()=>sv.base=bj);n++}
      [['medicoes',p.medicoes,sv.med],['metas',p.metas,sv.meta]].forEach(([col,arr,map])=>{
        const ids=new Set();
        arr.forEach(x=>{ids.add(x.id);const j=stable(x);if(map[x.id]!==j){b.set(ref.collection(col).doc(x.id),limpo(x));depois.push(()=>map[x.id]=j);n++}});
        Object.keys(map).forEach(k=>{if(!ids.has(k)){b.delete(ref.collection(col).doc(k));depois.push(()=>delete map[k]);n++}});
      });
      if(n){await b.commit();depois.forEach(f=>f())}
      if(!subs[id])assinarSub(id);
    }
    setStatus('Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    setStatus('Não foi possível salvar ('+(e.code||e.message)+')');
    if(e.code==='permission-denied')toast('Seu perfil não tem permissão para essa alteração');

  if(again[id]){again[id]=false;flush(id)}else dirty[id]=false;
}
function recebeBase(id,data){
  const sv=svDe(id), cur=S.obras[id];
  const nova=normaliza({...limpo(data),medicoes:cur?cur.medicoes:[],metas:cur?cur.metas:[]});
  const remoto=stable(partes(nova).base);
  if(cur&&(dirty[id]||inflight[id])&&stable(partes(cur).base)!==sv.base){sv.base=remoto;return}
  sv.base=remoto;
  S.obras[id]=nova;
  if(!subs[id])assinarSub(id);
  if(!S.atual||!S.obras[S.atual])S.atual=id;
  agendaRender();
}
function removeLocal(id){(subs[id]||[]).forEach(f=>f());delete subs[id];delete saved[id];delete S.obras[id];if(S.atual===id)S.atual=Object.keys(S.obras)[0]||null;agendaRender()}
function assinarSub(id){
  const ref=fs.collection(OBRAS).doc(id);
  subs[id]=['medicoes','metas'].map(col=>ref.collection(col).onSnapshot(snap=>{
    const o=S.obras[id]; if(!o)return;
    const map=col==='medicoes'?svDe(id).med:svDe(id).meta;
    const local=Object.fromEntries((o[col]||[]).map(x=>[x.id,x]));
    const novo=[], ids=new Set();
    snap.docs.forEach(d=>{const data=d.data(), l=local[d.id];ids.add(d.id);
      if(col==='medicoes'){if(data.diasPadrao==null)data.diasPadrao=o.diasPadrao;data.dias=data.dias||{};if(!data.linhas)data.linhas=[]}
      if(col==='metas'){data.linhas=data.linhas||[];data.equipe=data.equipe||{};data.crit=data.crit||{}}
      if(l&&stable(l)!==map[d.id]&&(dirty[id]||inflight[id]))novo.push(l);else novo.push(data);
      map[d.id]=stable(data)});
    (o[col]||[]).forEach(x=>{if(!ids.has(x.id)&&map[x.id]===undefined)novo.push(x)});
    Object.keys(map).forEach(k=>{if(!ids.has(k))delete map[k]});
    novo.sort((a,b)=>(a.criado||0)-(b.criado||0));
    o[col]=novo;
    agendaRender();
  },e=>setStatus('Erro ao ler '+col+' ('+e.code+')')));
}
function limparAssinaturas(){

/* ---------- cálculos ---------- */
const fnById=(o,id)=>o.funcoes.find(f=>f.id===id);
const pessoa=(o,id)=>o.funcionarios.find(f=>f.id===id);
const horaSem=(o,f)=>f?num(f.hora)/(1+o.enc/100):0;
function calc(o,s){
  const mo=num(s.mo);
  const teto=o.regime==='clt'?mo/(1+o.enc/100):mo*(1-o.imp/100);
  const md=o.modelo||'producao', pp=md==='producao'?0:Math.max(0,num(o.premioPct))/100;
  const preco=md==='meta'?0:Math.max(0,teto*(1-o.margem/100-pp));
  const premioU=teto*pp;
  const of=fnById(o,s.of), aj=fnById(o,s.aj);
  const auto=s.pct==null||s.pct==='';
  const hO=horaSem(o,of), hA=aj?horaSem(o,aj):0;
  const pct=auto?(hA>0?hO/(hO+hA)*100:100):Math.min(100,Math.max(0,num(s.pct)));
  const pOf=preco*pct/100, pAj=Math.max(0,preco-pOf);
  const dia=o.horasDia*(horaSem(o,of)+(pct<100?horaSem(o,aj):0));
  return {teto,preco,premioU,pOf,pAj,pct,auto,eq:preco>0?dia/preco:null,verba:teto*num(s.qtd),
    moTot:mo*num(s.qtd),matTot:num(s.mat)*num(s.qtd)};
}
function medidoAcum(o,sid,exceptMed){
  let q=0;
  if(o.modelo==='meta'){(o.metas||[]).forEach(mt=>{if(mt.encerrada)mt.linhas.forEach(l=>{if(l.sid===sid)q+=num(l.qtd)})});return q}
  o.medicoes.forEach(m=>{if(m.id===exceptMed)return;m.linhas.forEach(l=>{if(l.sid===sid)q+=num(l.qtd)})});return q;
}
const hoje=()=>new Date().toISOString().slice(0,10);
const diasEntre=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function calcMeta(o,mt){
  let verba=0,sug=0;
  const linhas=mt.linhas.map(l=>{const s=o.servicos.find(x=>x.id===l.sid);if(!s)return {l,s:null,v:0,p:0};const c=calc(o,s),q=num(l.qtd);verba+=q*c.teto;sug+=q*c.premioU;return {l,s,c,q,v:q*c.teto,p:q*c.premioU}});
  const manual=mt.premio!=null&&mt.premio!=='';
  const premio=manual?num(mt.premio):sug;
  const atraso=mt.entrega&&mt.prazo?diasEntre(mt.prazo,mt.entrega):null;
  const crit=mt.crit||{};
  const prazoOk=crit.prazo!=null?crit.prazo:(atraso!=null?atraso<=0:false);
  const P=o.pesos, tot=num(P.prazo)+num(P.qual)+num(P.org)||1;
  const pct=((prazoOk?num(P.prazo):0)+(crit.qual?num(P.qual):0)+(crit.org?num(P.org):0))/tot*100;
  const ganho=mt.entrega?premio*pct/100:0;
  const eq=Object.entries(mt.equipe||{}).map(([fid,d])=>{const pe=pessoa(o,fid),f=pe?fnById(o,pe.funcao):null;return {fid,nome:pe?pe.nome:'(removido)',funcao:f?f.nome:'—',dias:num(d),w:num(d)*(horaSem(o,f)||1)}});
  const W=eq.reduce((a,x)=>a+x.w,0)||1; eq.forEach(x=>x.valor=ganho*x.w/W);
  let st='and',stTxt='Em andamento';
  if(mt.encerrada){st='done';stTxt='Encerrada e paga'}
  else if(mt.entrega){st='eval';stTxt='Entregue: avaliar e encerrar'}
  else if(mt.prazo&&hoje()>mt.prazo){st='late';stTxt=`Atrasada ${diasEntre(mt.prazo,hoje())} dia(s)`}
  return {linhas,verba,sug,premio,manual,atraso,prazoOk,pct,ganho,eq,st,stTxt,acima:premio>sug+0.005};
}
function premiosPagos(o){return (o.metas||[]).filter(m=>m.encerrada).reduce((a,m)=>a+calcMeta(o,m).ganho,0)}
function calcMed(o,m){
  const pes={}; let naoDist=0, moOrc=0, prodTot=0; const alertas=[];
  const add=(fid,v,s)=>{if(!fid){naoDist+=v;return}(pes[fid]=pes[fid]||{prod:0,itens:[]}).prod+=v;pes[fid].itens.push(s)};
  const linhas=m.linhas.map(l=>{
    const s=o.servicos.find(x=>x.id===l.sid); if(!s)return {l,s:null,valor:0};
    const c=calc(o,s), q=num(l.qtd), valor=q*c.preco;
    moOrc+=q*num(s.mo); prodTot+=valor;
    add(l.of,q*c.pOf,{nome:s.nome,un:s.un,q,unit:c.pOf,papel:'Oficial'}); if(c.pAj>0)add(l.aj,q*c.pAj,{nome:s.nome,un:s.un,q,unit:c.pAj,papel:'Ajudante'});
    const outras=medidoAcum(o,s.id,m.id), over=outras+q>num(s.qtd)+1e-9;
    if(over)alertas.push(`${s.nome}: medido acumulado (${m2(outras+q)} ${s.un}) passa do orçado (${m2(num(s.qtd))} ${s.un}).`);
    if(c.teto<=0)alertas.push(`${s.nome}: não tem mão de obra no orçamento. Não há verba para pagar produção.`);
    return {l,s,c,q,valor,over,saldo:num(s.qtd)-outras};
  });
  let custo=0;
  const lista=Object.entries(pes).map(([fid,p])=>{
    const pe=pessoa(o,fid), f=pe?fnById(o,pe.funcao):null;
    const dias=m.dias&&m.dias[fid]!=null?num(m.dias[fid]):num(m.diasPadrao??o.diasPadrao);
    const horas=dias*o.horasDia;
    const sal=o.regime==='clt'?horaSem(o,f)*horas:0;
    const bonif=Math.max(0,p.prod-sal), ret=bonif*o.ret/100, pagar=bonif-ret;
    custo+=o.regime==='clt'?Math.max(sal,p.prod)*(1+o.enc/100):p.prod/(1-o.imp/100);
    return {fid,itens:p.itens,cpf:pe?pe.cpf:'',nome:pe?pe.nome:'(removido)',funcao:f?f.nome:'—',dias,horas,sal,prod:p.prod,bonif,ret,pagar,low:o.regime==='clt'&&p.prod<sal};
  }).sort((a,b)=>a.nome.localeCompare(b.nome));
  return {linhas,lista,naoDist,moOrc,custo,prodTot,alertas,ratio:moOrc>0?custo/moOrc:0};
}

function kpis(o){
  const r=resumoObra(o), comp=r.usado+r.premios, saldo=r.verba-comp, pc=r.verba>0?comp/r.verba:0, ratio=r.moMed>0?r.custo/r.moMed:null;
  const cor=ratio==null?'var(--muted)':ratio<=0.9?'var(--green)':ratio<=1?'var(--amber)':'var(--red)';
  const txt=ratio==null?'Sem medição ainda':ratio<=0.9?'Dentro do orçado':ratio<=1?'No limite':'Acima do orçado';
  return `<div class="kpis">
    <div class="kpi"><span class="k-l">Verba de mão de obra</span><span class="k-v">${brl(r.verba)}</span><span class="k-s">teto para salários, produção e prêmios</span></div>
    <div class="kpi"><span class="k-l">Já comprometido</span><span class="k-v">${brl(comp)}</span>
      <span class="k-bar" aria-hidden="true"><i style="width:${Math.min(100,pc*100)}%;background:${pc>1?'var(--red)':'var(--navy)'}"></i></span>
      <span class="k-s">${F1.format(pc*100)}% da verba${o.modelo!=='producao'&&r.premios?` · prêmios ${brl(r.premios)}`:''}</span></div>
    <div class="kpi"><span class="k-l">Saldo de verba</span><span class="k-v" style="color:${saldo<0?'var(--red)':'var(--green)'}">${brl(saldo)}</span><span class="k-s">${saldo<0?'verba estourada':'disponível até o fim da obra'}</span></div>
    <div class="kpi"><span class="k-l">Custo real ÷ orçado</span><span class="k-v" style="color:${cor}">${ratio==null?'—':F0.format(ratio*100)+'%'}</span><span class="k-s">${txt}${r.ult?` · ${esc(r.ult.periodo)}`:''}</span></div>
  </div>`;
}
function cabecalhoObra(o){

  const pcts=o.regime==='clt'?`encargos ${F1.format(o.enc)}%`:`impostos ${F1.format(o.imp)}%`;
  return `<section class="obra-head">
    <div class="oh-id">
      <label class="eyebrow" for="selObra">Obra</label>
      <div class="oh-sel"><select id="selObra" data-act="obra" class="obra-select">${obras.map(x=>`<option value="${x.id}" ${x.id===S.atual?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>

}

        ${md!=='meta'?`<label>Margem de segurança (%)<input type="number" step="0.5" data-p="margem" value="${o.margem}"><span class="hint">chuva, retrabalho, semanas fracas</span></label>`:''}
        ${md!=='producao'?`<label>Fundo de prêmios (%)<input type="number" step="0.5" data-p="premioPct" value="${o.premioPct}"><span class="hint">do teto, pago nas metas</span></label>`:''}
        <label>Retenção até a entrega (%)<input type="number" step="0.5" data-p="ret" value="${o.ret}"><span class="hint">liberada sem retrabalho</span></label>

          ${md!=='meta'?`<i style="flex:${prod};background:var(--navy)" title="Produção ${F1.format(prod)}%"></i>`:''}
          ${md!=='producao'?`<i style="flex:${num(o.premioPct)};background:var(--green)" title="Prêmios ${F1.format(o.premioPct)}%"></i>`:''}
          ${md!=='meta'?`<i style="flex:${num(o.margem)};background:var(--amber)" title="Margem ${F1.format(o.margem)}%"></i>`:`<i style="flex:${100-num(o.premioPct)};background:var(--line)" title="Salários"></i>`}
        </div>
        <p class="hint">${md==='meta'?`Teto: ${F1.format(o.premioPct)}% prêmios · restante cobre salários`:`Teto: ${F1.format(prod)}% produção${md!=='producao'?` · ${F1.format(o.premioPct)}% prêmios`:''} · ${F1.format(o.margem)}% margem`}</p></fieldset>
      ${o.regime==='clt'?`<fieldset><legend>Jornada</legend><div class="dr-grid">
        <label>Dias úteis da quinzena<input type="number" step="1" data-p="diasPadrao" value="${o.diasPadrao}"><span class="hint">padrão das novas medições</span></label>
        <label>Jornada diária (h)<input type="number" step="0.1" data-p="horasDia" value="${o.horasDia}"><span class="hint">44h ÷ 5 dias = 8,8</span></label></div></fieldset>`:`<fieldset><legend>Jornada</legend><label>Horas por dia<input type="number" step="0.1" data-p="horasDia" value="${o.horasDia}"></label></fieldset>`}
      ${can('obras')?`<fieldset class="perigo"><legend>Obra</legend><div class="tools"><button data-act="dupObra">Duplicar obra</button><button class="danger" data-act="delObra">Excluir obra</button></div><p class="hint">Duplicar copia tabela, funções e equipe, sem as medições.</p></fieldset>`:''}
    </div></aside>`;

function render(){
  const app=document.getElementById('app');
  const foco=(()=>{const a=document.activeElement;if(!a||!app.contains(a))return null;if(a.id)return '#'+a.id;for(const k of ['p','pe']){if(a.dataset&&a.dataset[k]!=null)return `[data-${k}="${a.dataset[k]}"]`}return null})();
  document.body.classList.toggle('travado',false);
  if(!authPronto){app.innerHTML='<div class="page"><div class="empty" style="margin-top:12vh"><p class="muted">Carregando…</p></div></div>';return}
  if(!USER){app.innerHTML='<div class="page">'+vLogin()+'</div>';const e=document.getElementById('lEmail');if(e)e.focus();return}
  if(!PERFIL||PERFIL.ativo===false){app.innerHTML=`<div class="page"><div class="login"><h1>Sem acesso</h1><p class="muted">Você entrou como <b>${esc(USER.email)}</b>, mas ainda não tem perfil liberado na Produção de obra. Peça ao administrador para cadastrar seu e-mail na aba Usuários.</p><button data-act="sair">Sair</button></div></div>`;return}
  const o=O();
  const G=grupos(o);
  if(!G.some(g=>g.tabs.some(([k])=>k===tab)))tab=o?'precos':'obras';
  if(!G.some(g=>g.tabs.some(([k])=>k===tab)))tab=G[0].tabs[0][0];
  const gA=(G.find(g=>g.tabs.some(([k])=>k===tab))||G[0]);
  ultimoDoGrupo[gA.k]=tab;
  let h=barra(o,G,gA.k)+'<div class="page">';
  if(!o){
    if(tab==='usuarios'&&can('usuarios')){app.innerHTML=h+'<main>'+vUsuarios()+'</main></div>';aplicaPermissoes();return}
    app.innerHTML=h+`<div class="empty big"><h2>Nenhuma obra ${can('obras')?'cadastrada':'liberada'} ainda</h2>${can('obras')?`<p class="muted">Crie a obra e depois importe os relatórios do Sienge.</p><div class="tools" style="justify-content:center"><button class="pri" data-act="novaObra">Criar primeira obra</button>${can('usuarios')?`<button data-act="tab" data-v="usuarios">Cadastrar usuários</button>`:''}</div>`:`<p class="muted">Fale com o administrador para liberar suas obras.</p>`}</div></div>`;return}
  if(tab!=='obras'&&tab!=='usuarios')h+=cabecalhoObra(o);
  else h+=`<div class="pg-head"><p class="eyebrow">${gA.nome}</p></div>`;
  if(gA.tabs.length>1)h+=`<nav class="subtabs" role="tablist" aria-label="${gA.nome}">${gA.tabs.map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" data-act="tab" data-v="${k}">${t}</button>`).join('')}</nav>`;
  h+='<main>'+({usuarios:vUsuarios,metas:vMetas,obras:vObras,precos:vPrecos,medicao:vMedicao,saldo:vSaldo,abc:vABC,equipe:vEquipe,importar:vImportar}[tab])(o)+'</main></div>';
  h+=gaveta(o);
  app.innerHTML=h;
  document.body.classList.toggle('travado',cfgAberto);

const optsFn=(o,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+o.funcoes.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.nome)}</option>`).join('');
const optsPe=(o,sel,blank)=>`<option value="">${blank||'—'}</option>`+o.funcionarios.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nome)}</option>`).join('');

function abcMap(o){
  const rows=o.servicos.map(s=>{const c=calc(o,s);return {id:s.id,v:c.moTot+c.matTot}}).sort((a,b)=>b.v-a.v);
  const tot=rows.reduce((a,r)=>a+r.v,0)||1; let acc=0; const m={};
  rows.forEach(r=>{const antes=acc/tot*100;acc+=r.v;m[r.id]=r.v<=0?'C':antes<80?'A':antes<95?'B':'C'});return m;
}
const semAcento=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function passa(o,s,abc){
  if(FL.q){const termos=semAcento(FL.q).split(/\s+/).filter(Boolean);const alvo=semAcento((s.cod||'')+' '+s.nome+' '+s.un);if(!termos.every(t=>alvo.includes(t)))return false}
  if(FL.cls&&abc[s.id]!==FL.cls)return false;
  if(FL.fn&&s.of!==FL.fn&&s.aj!==FL.fn)return false;
  if(FL.sit){const c=calc(o,s),med=medidoAcum(o,s.id,null),q=num(s.qtd);
    if(FL.sit==='semverba'&&c.teto>0)return false;
    if(FL.sit==='naoini'&&med>0)return false;
    if(FL.sit==='andamento'&&!(med>0&&med<q))return false;
    if(FL.sit==='concl'&&!(q>0&&med>=q))return false;
    if(FL.sit==='acima'&&!(med>q+1e-9))return false;}
  return true;
}
const filtroAtivo=()=>!!(FL.q||FL.cls||FL.fn||FL.sit);
function ajuda(titulo,html){return `<details class="ajuda"><summary>${titulo}</summary><div class="ajuda-pop">${html}</div></details>`}
function filtroBar(o,mostrados,acoes){
  return `<div class="toolbar" role="search">
    <label class="busca"><span class="sr">Buscar serviço</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="fBusca" data-flt="q" value="${esc(FL.q)}" placeholder="Buscar por nome, código ou unidade" autocomplete="off"></label>
    <label class="fsel${FL.cls?' on':''}"><span>ABC</span><select data-flt="cls" aria-label="Filtrar por classe ABC"><option value="">Todas as classes</option>${['A','B','C'].map(k=>`<option ${FL.cls===k?'selected':''}>${k}</option>`).join('')}</select></label>
    <label class="fsel${FL.fn?' on':''}"><span>Função</span><select data-flt="fn" aria-label="Filtrar por função"><option value="">Todas as funções</option>${o.funcoes.map(f=>`<option value="${f.id}" ${FL.fn===f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></label>
    <label class="fsel${FL.sit?' on':''}"><span>Situação</span><select data-flt="sit" aria-label="Filtrar por situação">${[['','Todas as situações'],['naoini','Não iniciados'],['andamento','Em execução'],['concl','Concluídos'],['acima','Acima do orçado'],['semverba','Sem verba de MO']].map(([v,t])=>`<option value="${v}" ${FL.sit===v?'selected':''}>${t}</option>`).join('')}</select></label>
    <span class="cont">${mostrados} de ${o.servicos.length}${filtroAtivo()?' · <button class="link" data-act="limparFiltro">limpar</button>':''}</span>
    ${acoes?`<span class="tb-acoes">${acoes}</span>`:''}
  </div>`;
}
let addAberto=false;
function vPrecos(o){
  const base=o.regime==='clt'?`Teto = MO orçada ÷ ${F2.format(1+o.enc/100)} (tira os encargos).`:`Teto = MO orçada − ${o.imp}% de impostos da nota.`;
  const regra=base+' '+(o.modelo==='producao'?`Preço de produção = teto − ${o.margem}% de margem.`
    :o.modelo==='misto'?`Do teto, ${o.premioPct}% vai para o fundo de prêmios, ${o.margem}% fica de margem e o restante é o preço de produção.`
    :`Não há pagamento por quantidade: ${o.premioPct}% do teto forma o fundo de prêmios e o restante cobre os salários.`);
  let tvAll=0; o.servicos.forEach(s=>tvAll+=calc(o,s).verba);
  let h=`<div class="sec-head"><div><h2>Tabela de preços</h2><p class="sec-sub">${o.servicos.length} serviço(s) · verba total ${brl(tvAll)}</p></div>
    <div class="sec-acoes"><button class="toggle" data-act="detalhes" aria-pressed="${detalhes}" title="Mostrar código, material e funções">Detalhes</button><button data-act="copiarTabela">Copiar para Excel</button>${addAberto?'':'<button class="pri" data-act="novoServ">+ Novo serviço</button>'}
    ${ajuda('Como o preço é calculado',`<p>${regra}</p><p><b>Equilíbrio</b>: quanto a equipe precisa produzir por dia para a produção passar do salário.</p><p>Linhas em vermelho não têm mão de obra no orçamento: qualquer pagamento ali sai do lucro.</p><p>A função de quem executa vem das composições do Sienge ou do nome do serviço. Para conferir ou mudar, ligue <b>Detalhes</b>.</p>`)}</div></div>`;
  if(addAberto)h+=`<div class="quick" role="group" aria-label="Novo serviço">
      <label>Serviço<input id="qNome" placeholder="Ex.: Reboco interno 1,5cm"></label>
      <label>Unidade<input id="qUn" placeholder="m2"></label>
      <label>Quantidade orçada<input id="qQtd" inputmode="decimal" placeholder="0,00"></label>
      <label>MO R$/un (Sienge)<input id="qMo" inputmode="decimal" placeholder="0,0000"></label>
      <div class="q-acoes"><button class="pri" data-act="addRapido">Adicionar</button><button class="ghost" data-act="novoServ">Fechar</button></div>
    </div>`;
  if(!o.servicos.length)return h+`<div class="empty big"><h3>A tabela de preços está vazia</h3><p class="muted">Importe os relatórios do Sienge para montar tudo de uma vez, ou cadastre os serviços um a um.</p>
    <div class="tools" style="justify-content:center"><button class="pri" data-act="tab" data-v="importar">Importar do Sienge</button>${addAberto?'':'<button data-act="novoServ">Adicionar serviço</button>'}</div></div>`;
  let tv=0,tmo=0;
  const D=detalhes, abc=abcMap(o), lista=o.servicos.filter(s=>passa(o,s,abc));
  h+=filtroBar(o,lista.length);
  if(!lista.length)return h+`<div class="empty"><p>Nenhum serviço encontrado com esses filtros.</p><button data-act="limparFiltro">Limpar filtros</button></div>`;
  const P=o.modelo!=='meta', Q=o.modelo!=='producao';
  h+=`<div class="scroll"><table class="tbl"><thead><tr>${D?'<th>Cód.</th>':''}<th${D?'':' class="stick"'}>Serviço</th><th>Un</th><th class="num">Qtd orçada</th><th class="num">MO orçada<span class="th-sub">R$/un c/ enc.</span></th>${D?'<th class="num">Material<span class="th-sub">R$/un</span></th><th>Oficial</th><th class="num">% of.</th><th>Ajudante</th>':''}<th class="num">Teto<span class="th-sub">R$/un</span></th>${P?'<th class="num th-key">Preço produção<span class="th-sub">R$/un</span></th>':''}${Q?`<th class="num${P?'':' th-key'}">Prêmio<span class="th-sub">R$/un</span></th>`:''}${P?'<th class="num">Equilíbrio<span class="th-sub">por dia</span></th>':''}<th class="num">Verba teto</th><th><span class="sr">Ações</span></th></tr></thead><tbody>`;
  lista.forEach(s=>{
    const c=calc(o,s); tv+=c.verba; tmo+=c.moTot;

function vABC(o){
  let h=`<div class="sec-head"><div><h2>Curva ABC</h2><p class="sec-sub">Serviços ordenados pelo peso no custo da obra.</p></div>
    ${ajuda('Como usar',`<p><b>Classe A</b>: os poucos serviços que somam até 80% do custo. É onde a medição, a produtividade e a negociação fazem mais diferença.</p><p><b>B</b>: de 80% a 95%. <b>C</b>: o restante.</p><p>Clique numa classe para filtrar a tabela.</p>`)}</div>`;
  if(!o.servicos.length)return h+`<div class="empty big"><h3>Sem serviços cadastrados</h3><p class="muted">A curva aparece depois que a tabela de preços estiver montada.</p><div class="tools" style="justify-content:center"><button class="pri" data-act="tab" data-v="importar">Importar do Sienge</button></div></div>`;
  const rows=o.servicos.map(s=>{const c=calc(o,s);const v=abcBase==='mo'?c.moTot:abcBase==='mat'?c.matTot:c.moTot+c.matTot;return {s,v,c}}).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);

  rows.forEach(r=>{acc+=r.v;r.p=r.v/tot*100;r.acc=acc/tot*100;r.cl=(r.acc-r.p)<80?'A':(r.acc-r.p)<95?'B':'C';cnt[r.cl][0]++;cnt[r.cl][1]+=r.v});
  const max=rows[0]?rows[0].v:1;
  h+=`<div class="abc-cards">${['A','B','C'].map(k=>`<button class="abc-card ${k}${FL.cls===k?' on':''}" data-act="clsFiltro" data-v="${k}" aria-pressed="${FL.cls===k}">
      <span class="abc-k">Classe ${k}</span><b>${brl(cnt[k][1])}</b><span class="small muted">${cnt[k][0]} serviço(s) · ${F1.format(tot?cnt[k][1]/tot*100:0)}% do custo</span></button>`).join('')}

  h+=filtroBar(o,vis.length,`<label class="fsel"><span>Base</span><select data-act="abcBase" aria-label="Base da curva"><option value="total" ${abcBase==='total'?'selected':''}>MO + material</option><option value="mo" ${abcBase==='mo'?'selected':''}>Só mão de obra</option><option value="mat" ${abcBase==='mat'?'selected':''}>Só material</option></select></label>`);
  if(!vis.length)return h+`<div class="empty"><p>Nenhum serviço com esses filtros.</p><button data-act="limparFiltro">Limpar filtros</button></div>`;
  h+=`<div class="scroll"><table class="tbl"><thead><tr><th>Classe</th><th class="stick">Serviço</th><th class="num">Valor</th><th class="num">%</th><th class="num">Acumulado</th><th style="width:26%">Peso</th></tr></thead><tbody>`;
  vis.forEach(r=>{h+=`<tr><td><span class="chip ${r.cl}">${r.cl}</span></td><td class="svc stick" title="${esc(r.s.nome)}">${esc(r.s.nome)}</td><td class="num strong">${m2(r.v)}</td><td class="num">${F1.format(r.p)}%</td><td class="num soft">${F1.format(r.acc)}%</td><td><div class="abc-bar ${r.cl}" style="width:${Math.max(1,r.v/max*100)}%"></div></td></tr>`});
  return h+`</tbody><tfoot><tr><td colspan="2"><span class="tf-l">${filtroAtivo()?'Total filtrado':'Total da curva'}</span></td><td class="num tf-v">${brl(vis.reduce((a,r)=>a+r.v,0))}</td><td colspan="3"></td></tr></tfoot></table></div>`;
}

  h+=`<div class="sit-cards">${[['and','Em andamento','nav'],['late','Atrasadas','bad'],['eval','Para avaliar','warn'],['done','Encerradas','ok']].map(([k,t,c])=>`<button class="sit ${c}${metaFiltro===k?' on':''}" data-act="metaFiltro" data-v="${k}" aria-pressed="${metaFiltro===k}"><b>${cnt[k]}</b><span>${t}</span></button>`).join('')}</div>`;

          ${r.linhas.map((x,i)=>`<tr><td class="svc"><select class="cell svc-sel" data-mtl="${mt.id}|${i}" data-k="sid" ${L} aria-label="Serviço">${o.servicos.map(sv=>`<option value="${sv.id}" ${sv.id===x.l.sid?'selected':''}>${esc(sv.nome)}</option>`).join('')}</select></td>
            <td class="num"><span class="qtd-un"><input class="cell n" inputmode="decimal" data-mtl="${mt.id}|${i}" data-k="qtd" value="${m2(num(x.l.qtd))}" ${L} aria-label="Quantidade"><span>${x.s?esc(x.s.un):''}</span></span></td>
            <td class="num soft">${m2(x.v)}</td><td class="num key">${m2(x.p)}</td>
            <td class="acao">${L?'':`<button class="ghost del" data-act="delMetaLinha" data-id="${mt.id}" data-i="${i}" aria-label="Remover serviço">✕</button>`}</td></tr>`).join('')}
          </tbody><tfoot><tr><td><span class="tf-l">Total do setor</span></td><td></td><td class="num">${m2(r.verba)}</td><td class="num tf-v">${brl(r.sug)}</td><td></td></tr></tfoot></table></div>
          ${L?'':`<button class="add-row" data-act="addMetaLinha" data-id="${mt.id}">+ Adicionar serviço</button>`}</div>
        <div class="step"><h4><span class="sn">2</span>Equipe do setor</h4>
          ${o.funcionarios.length?`<div class="team">${o.funcionarios.map(p=>{const on=mt.equipe&&mt.equipe[p.id]!=null;const f=fnById(o,p.funcao);return `<div class="p${on?' on':''}"><label><input type="checkbox" data-mte="${mt.id}|${p.id}" ${on?'checked':''} ${L}> ${esc(p.nome)} <span class="small muted">${f?esc(f.nome):''}</span></label>${on?`<span class="small muted">dias <input inputmode="decimal" data-mtd="${mt.id}|${p.id}" value="${F1.format(num(mt.equipe[p.id]))}" ${L} aria-label="Dias de ${esc(p.nome)} no setor"></span>`:''}</div>`}).join('')}</div>`
          :`<div class="callout"><div><b>Nenhum funcionário cadastrado</b><p class="small muted">Cadastre a equipe para dividir o prêmio.</p></div><button class="pri" data-act="tab" data-v="equipe">Cadastrar equipe</button></div>`}</div>
        <div class="step"><h4><span class="sn">3</span>Entrega e prêmio</h4>

            <label>Prêmio da meta<input inputmode="decimal" data-mt="${mt.id}" data-k="premio" value="${r.manual?m2(r.premio):''}" placeholder="${m2(r.sug)} (sugerido)" ${L}></label>
            <label>Data da entrega<input type="date" data-mt="${mt.id}" data-k="entrega" value="${esc(mt.entrega||'')}" ${L}></label>
          </div>
          ${r.acima?`<div class="note bad">O prêmio está ${brl(r.premio-r.sug)} acima do fundo dos serviços deste setor. A diferença sai da margem da obra.</div>`:''}
          ${mt.entrega?`<p class="small" style="margin:8px 0;${r.atraso>0?'color:var(--red);font-weight:600':''}">${r.atraso>0?`Entregue com ${r.atraso} dia(s) de atraso`:r.atraso<0?`Entregue ${-r.atraso} dia(s) antes do prazo`:'Entregue no dia do prazo'}</p>
          <div class="crit">

            <label class="c"><input type="checkbox" data-mtc="${mt.id}|org" ${(mt.crit||{}).org?'checked':''} ${L}> Organização, limpeza e segurança <span class="pts">${pe.org} pts</span></label>

            ${r.eq.length?`<div class="team">${r.eq.map(x=>`<div class="p"><span>${esc(x.nome)} <span class="small muted">${esc(x.funcao)} · ${F1.format(x.dias)} dia(s)</span></span><b class="num">${brl(x.valor)}</b></div>`).join('')}</div>`:'<div class="note">Marque a equipe do setor para dividir o prêmio.</div>'}</div>`
          :`<p class="small muted" style="margin-top:8px">Quando o setor for entregue, lance a data para avaliar os critérios e calcular o prêmio.</p>`}
        </div></div>
        <div class="meta-acoes">
          ${mt.entrega?`<button class="${mt.encerrada?'':'pri'}" data-act="encMeta" data-id="${mt.id}">${mt.encerrada?'Reabrir meta':'Encerrar e lançar pagamento'}</button>`:''}

          ${L?'':`<button class="ghost del-txt" data-act="delMeta" data-id="${mt.id}">Excluir meta</button>`}
        </div>
      </div>`;
    }
    h+='</section>';
  });
  return h+'</div>';
}
const dataBRs=d=>d?d.split('-').reverse().slice(0,2).join('/'):'—';

let obraBusca='', addFuAberto=false, addUserAberto=false;
function vObras(){
  const todas=Object.values(S.obras).sort((a,b)=>a.nome.localeCompare(b.nome));
  const lista=todas.filter(o=>!obraBusca||SG.norm(o.nome).includes(SG.norm(obraBusca)));
  let h=`<div class="sec-head"><div><h2>Obras</h2><p class="sec-sub">${todas.length} obra(s) · cada uma com tabela de preços, equipe e medições próprias</p></div>

  if(todas.length>3)h+=`<div class="toolbar"><label class="busca"><span class="sr">Buscar obra</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="oBusca" data-flt="obra" value="${esc(obraBusca)}" placeholder="Buscar obra pelo nome" autocomplete="off"></label><span class="cont">${lista.length} de ${todas.length}</span></div>`;
  if(!lista.length)return h+`<div class="empty"><p>Nenhuma obra com esse nome.</p><button data-act="limparObraBusca">Limpar busca</button></div>`;
  h+='<div class="obras">';
  lista.forEach(o=>{const r=resumoObra(o), ratio=r.moMed>0?r.custo/r.moMed:null, comp=r.usado+r.premios, pc=r.verba>0?comp/r.verba:0;
    const cor=ratio==null?'var(--muted)':ratio<=0.9?'var(--green)':ratio<=1?'var(--amber)':'var(--red)';
    const st=ratio==null?'Sem medição':ratio<=0.9?'Dentro do orçado':ratio<=1?'No limite':'Acima do orçado';
    const atual=o.id===S.atual;
    h+=`<article class="obra-card${atual?' atual':''}">
      <div class="oc-h"><h3>${esc(o.nome)}</h3>${atual?'<span class="chip nav">Aberta</span>':''}</div>
      <p class="small muted">${o.servicos.length} serviço(s) · ${o.funcionarios.length} funcionário(s) · ${o.regime==='clt'?'CLT':'Empreiteiro'} · ${({producao:'só produção',misto:'produção + meta',meta:'só meta'})[o.modelo]}</p>
      <div class="oc-kpi"><div><span class="k-l">Custo real ÷ orçado</span><span class="oc-pct" style="color:${cor}">${ratio==null?'—':F0.format(ratio*100)+'%'}</span><span class="k-s">${st}</span></div>
        <div><span class="k-l">Verba comprometida</span><span class="oc-pct">${F0.format(pc*100)}%</span><span class="k-s">de ${brl(r.verba)}</span></div></div>
      <span class="k-bar" aria-hidden="true"><i style="width:${Math.min(100,pc*100)}%;background:${pc>1?'var(--red)':'var(--navy)'}"></i></span>
      <div class="oc-rows">
        ${o.modelo!=='meta'?`<div class="l"><span>Produção medida</span><b>${brl(r.usado)}</b></div>`:''}
        ${o.modelo!=='producao'?`<div class="l"><span>Prêmios pagos</span><b>${brl(r.premios)}</b></div>`:''}
        <div class="l"><span>Última medição</span><b>${r.ult?esc(r.ult.periodo):'nenhuma'}</b></div></div>
      <div class="oc-acoes"><button class="pri" data-act="abrirObra" data-id="${o.id}">Abrir obra</button>${o.modelo!=='meta'?`<button data-act="abrirMed" data-id="${o.id}">Lançar medição</button>`:''}</div></article>`});
  return h+'</div>';
}
function vEquipe(o){

      <label>Nome<input id="fuNome" placeholder="Nome completo"></label>
      <label>Função<select id="fuFuncao">${optsFn(o,(o.funcoes.find(f=>/pedreiro/i.test(f.nome))||o.funcoes[0]||{}).id)}</select></label>
      ${CPF?'<label>CPF <span class="hint">(sai no recibo)</span><input id="fuCpf" inputmode="numeric" placeholder="000.000.000-00"></label>':'<span></span>'}
      <div class="q-acoes"><button class="pri" data-act="criarFu">Adicionar</button><button class="ghost" data-act="addFu">Fechar</button></div></div>`;

  else{h+=`<div class="scroll"><table class="tbl"><thead><tr><th class="stick">Nome</th>${CPF?'<th>CPF</th>':''}<th>Função</th><th class="num th-key">Retido acumulado</th><th><span class="sr">Ações</span></th></tr></thead><tbody>`;

  o.funcoes.forEach(f=>{const hs=horaSem(o,f);
    h+=`<tr><td class="stick"><input class="cell nome fn-nome" data-fn="${f.id}" data-k="nome" value="${esc(f.nome)}" aria-label="Nome da função"></td><td class="num"><input class="cell n" inputmode="decimal" data-fn="${f.id}" data-k="hora" value="${m4(num(f.hora))}" aria-label="Hora com encargos"></td><td class="num soft">${m2(hs)}</td><td class="num key">${m2(hs*o.horasDia*o.diasPadrao)}</td><td class="num soft">${usoFn[f.id]||'—'}</td><td class="acao"><button class="ghost del" data-act="delFn" data-id="${f.id}" aria-label="Excluir ${esc(f.nome)}" title="Excluir função">✕</button></td></tr>`});
  return h+`</tbody></table></div></section>`;
}

const DZ=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];

function resumoObra(o){
  let verba=0,usado=0,moTot=0; o.servicos.forEach(s=>{const c=calc(o,s);verba+=c.verba;moTot+=c.moTot;usado+=medidoAcum(o,s.id,null)*c.preco});
  let custo=0,moMed=0; o.medicoes.forEach(m=>{const r=calcMed(o,m);custo+=r.custo;moMed+=r.moOrc});
  const ult=o.medicoes[o.medicoes.length-1];
  return {verba,usado,moTot,custo,moMed,ult,premios:premiosPagos(o)};
}

function resumoMeta(o,mt){
  const r=calcMeta(o,mt);
  let t=`${o.nome} — Meta: ${mt.nome}\nPrazo: ${mt.prazo?mt.prazo.split('-').reverse().join('/'):'—'} · Entrega: ${mt.entrega?mt.entrega.split('-').reverse().join('/'):'—'}\n`;

function ate999(n){if(n===100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(CT[c]);if(r<20){if(r)p.push(UN[r])}else{p.push(DZ[Math.floor(r/10)]+(r%10?' e '+UN[r%10]:''))}return p.join(' e ')}
function inteiroExt(n){if(!n)return 'zero';const mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(mi)p.push(mi===1?'um milhão':ate999(mi)+' milhões');if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');if(r)p.push(ate999(r));
  if(p.length>1){const ult=p.pop();return p.join(', ')+((r&&(r<100||r%100===0))||(!r)?' e ':', ')+ult}return p[0]}
function extenso(v){v=Math.round((v||0)*100)/100;const i=Math.floor(v),c=Math.round((v-i)*100);
  let t=i?inteiroExt(i)+(i===1?' real':(i%1e6===0?' de reais':' reais')):'';if(c)t+=(t?' e ':'')+inteiroExt(c)+(c===1?' centavo':' centavos');return t||'zero real'}

const SG={};
SG.norm=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
SG.key=(desc,un)=>SG.norm(String(desc||'').replace(/^\s*\d+\s*-\s*/,'')).replace(/[.;,\s]+$/,'')+'|'+SG.norm(un);
SG.isNum=v=>typeof v==='number'&&isFinite(v);
SG.num=v=>SG.isNum(v)?v:(typeof v==='string'&&/\d/.test(v)?num(v):0);
SG.texto=rows=>rows.slice(0,14).map(r=>(r||[]).filter(v=>v!=null).join(' ')).join(' \n ');
SG.header=(rows,need)=>{
  for(let i=0;i<Math.min(rows.length,60);i++){const r=rows[i]||[];const cols={};
    r.forEach((v,j)=>{if(v!=null)cols[SG.norm(v)]=j});
    if(need.every(n=>cols[n]!=null)){
      const starts=Object.values(cols).sort((a,b)=>a-b);
      const fim=c=>{const n=starts.find(s=>s>c);return n==null?c+12:n};
      const sub=rows[i+1]||[]; const unit={};
      sub.forEach((v,j)=>{if(SG.norm(v)==='unitario'){const nome=Object.keys(cols).filter(k=>cols[k]<=j).sort((a,b)=>cols[b]-cols[a])[0];if(nome&&unit[nome]==null)unit[nome]=j}});
      return {idx:i,cols,fim,unit,temSub:Object.keys(unit).length>0};
    }}
  return null;
};
SG.val=(row,h,nome)=>{const c=h.cols[nome];if(c==null)return null;
  if(h.unit[nome]!=null){const v=row[h.unit[nome]];return SG.isNum(v)?v:null}
  const e=h.fim(c);for(let j=c;j<e;j++){if(SG.isNum(row[j]))return row[j]}return null};
SG.txt=(row,h,nome)=>{const c=h.cols[nome];if(c==null)return '';const e=h.fim(c);for(let j=c;j<e;j++){if(row[j]!=null&&String(row[j]).trim()!=='')return String(row[j]).trim()}return ''};
SG.encargos=rows=>{
  for(const r of rows.slice(0,16)){const rr=r||[];const i=rr.findIndex(v=>SG.norm(v)==='encargos sociais');
    if(i>=0){const v=rr.slice(i+1).find(x=>x!=null&&String(x).trim()!=='');const t=SG.norm(v);
      if(/nao aplic/.test(t))return {cru:true,pct:null};
      const n=num(String(v));return {cru:false,pct:isFinite(n)&&n>0?(n<=3?n*100:n):null};}}
  return {cru:null,pct:null};
};
SG.tipo=rows=>{const t=SG.norm(SG.texto(rows));
  if(t.includes('composicoes de servicos'))return 'comp';
  if(t.includes('curva abc de insumos'))return 'insumos';
  if(SG.header(rows,['codigo','descricao','quantidade orcada','mao de obra']))return 'analitico';
  if(SG.header(rows,['codigo','descricao','quantidade orcada']))return 'sintetico';
  if(SG.header(rows,['codigo','descricao','unidade','mao de obra','materiais']))return 'servicos';
  return null;
};
SG.parse=rows=>{
  const tipo=SG.tipo(rows), enc=SG.encargos(rows), out={tipo,enc,obra:''};
  const ob=rows.slice(0,10).find(r=>r&&SG.norm(r.find(v=>v!=null))==='obra');
  if(ob)out.obra=String(ob.filter(v=>v!=null)[1]||'');
  if(tipo==='analitico'||tipo==='sintetico'){
    const h=tipo==='analitico'?SG.header(rows,['codigo','descricao','quantidade orcada','mao de obra']):SG.header(rows,['codigo','descricao','quantidade orcada']);
    const unCol=h.cols['unidade']!=null?'unidade':'un.';
    out.itens=[];let grupo='';
    for(let i=h.idx+1;i<rows.length;i++){const r=rows[i]||[];
      const cod=String(r[h.cols['codigo']]??'').trim(), desc=SG.txt(r,h,'descricao'), un=SG.txt(r,h,unCol), q=SG.val(r,h,'quantidade orcada');
      if(/^total/i.test(cod))break;
      if(!desc)continue;
      if(!un||q==null){grupo=desc;continue}
      const it={eap:cod,grupo,desc,un,qtd:q};
      if(tipo==='analitico'){it.mo=SG.val(r,h,'mao de obra')||0;it.mat=(SG.val(r,h,'materiais')||0)+(SG.val(r,h,'equipamentos de obra')||0)+(SG.val(r,h,'verbas')||0)}
      else it.pu=SG.val(r,h,'preco unitario')||0;
      out.itens.push(it);
    }
  }else if(tipo==='comp'){
    out.servicos={};let cur=null,h=null;
    for(const r0 of rows){const r=r0||[];const v=r.filter(x=>x!=null&&String(x).trim()!=='');if(!v.length)continue;
      const c0=SG.norm(v[0]);
      if(c0==='servico'){const nome=String(v[1]||'');const iu=v.findIndex(x=>SG.norm(x)==='unidade');const un=iu>=0?String(v[iu+1]||''):'';
        const m=nome.match(/^\s*(\d+)\s*-\s*(.*)$/);cur={cod:m?m[1]:'',desc:m?m[2]:nome,un,mo:[],tot:null};out.servicos[SG.key(cur.desc,un)]=cur;continue}
      if(c0==='tipo'){h=SG.header([r],['tipo','codigo','descricao','quantidade','mao de obra']);continue}
      if(!cur||!h)continue;
      if(c0==='total do servico'){cur.tot={mo:SG.val(r,h,'mao de obra')||0,mat:SG.val(r,h,'materiais')||0,eq:SG.val(r,h,'equipamentos de obra')||0,ver:SG.val(r,h,'verbas')||0};continue}
      if(SG.norm(r[h.cols['tipo']])==='mo'){cur.mo.push({cod:String(r[h.cols['codigo']]??''),nome:SG.txt(r,h,'descricao'),un:SG.txt(r,h,'unidade'),qtd:SG.val(r,h,'quantidade')||0,preco:SG.val(r,h,'preco unitario')||0,valor:SG.val(r,h,'mao de obra')||0})}
    }
  }else if(tipo==='servicos'){
    const h=SG.header(rows,['codigo','descricao','unidade','mao de obra','materiais']);out.itens=[];
    for(let i=h.idx+1;i<rows.length;i++){const r=rows[i]||[];const cod=r[h.cols['codigo']];if(cod==null||!/^\d+$/.test(String(cod).trim()))continue;
      out.itens.push({cod:String(cod).trim(),desc:SG.txt(r,h,'descricao'),un:SG.txt(r,h,'unidade'),mo:SG.val(r,h,'mao de obra')||0,mat:(SG.val(r,h,'materiais')||0)+(SG.val(r,h,'equipamentos de obra')||0)+(SG.val(r,h,'verbas')||0)})}
  }else if(tipo==='insumos'){
    const h=SG.header(rows,['codigo','descricao','quantidade','preco unitario']);out.itens=[];
    const unCol=h.cols['un.']!=null?'un.':'unidade';
    for(let i=h.idx+1;i<rows.length;i++){const r=rows[i]||[];const cod=r[h.cols['codigo']];if(cod==null||!/^\d+$/.test(String(cod).trim()))continue;
      out.itens.push({cod:String(cod).trim(),desc:SG.txt(r,h,'descricao'),un:SG.txt(r,h,unCol),qtd:SG.val(r,h,'quantidade')||0,preco:SG.val(r,h,'preco unitario')||0})}
  }
  return out;
};
SG.ehAjudante=n=>/servente|ajudante|auxiliar|operador|vigia|apontador/i.test(n);
/* monta a lista de serviços a importar */
SG.montar=(relatorios,o)=>{
  const R={}; relatorios.forEach(x=>{if(x.tipo&&!R[x.tipo])R[x.tipo]=x});
  const fator=1+o.enc/100, avisos=[];
  const cru=Object.values(R).some(x=>x.enc.cru===true);
  const pctRel=Object.values(R).map(x=>x.enc.pct).find(p=>p);
  const comp=R.comp?R.comp.servicos:{};
  const svc={};(R.servicos?R.servicos.itens:[]).forEach(s=>svc[SG.key(s.desc,s.un)]=s);
  const base=R.analitico?R.analitico.itens:R.sintetico?R.sintetico.itens:null;
  if(!base){
    if(R.comp||R.servicos)avisos.push('Sem o Orçamento analítico ou sintético, os serviços entram sem quantidade. Envie também o Orçamento para preencher as quantidades.');
  }
  const grupos=new Map();
  const lista=base||Object.values(comp).map(c=>({desc:c.desc,un:c.un,qtd:0}));
  lista.forEach(it=>{const k=SG.key(it.desc,it.un);
    if(!grupos.has(k))grupos.set(k,{k,desc:it.desc,un:it.un,qtd:0,linhas:0,moU:it.mo,matU:it.mat,pu:it.pu,etapas:new Set()});
    const g=grupos.get(k);g.qtd+=it.qtd||0;g.linhas++;if(it.grupo)g.etapas.add(it.grupo)});
  const funcs={};
  const res=[...grupos.values()].map(g=>{
    const c=comp[g.k], s=svc[g.k];
    let moCru=null, mat=0, of=null, aj=null, pct=null, origem='';
    if(c&&c.tot){
      const h=c.mo.filter(m=>SG.norm(m.un)==='h'), outros=c.mo.filter(m=>SG.norm(m.un)!=='h');
      const vh=h.reduce((a,m)=>a+m.valor,0), vo=outros.reduce((a,m)=>a+m.valor,0);
      g.mo=cru?vh*fator+vo:c.tot.mo; mat=c.tot.mat+c.tot.eq+c.tot.ver; origem='composição';
      h.forEach(m=>{const n=m.nome.trim();if(!funcs[n])funcs[n]={nome:n,hora:cru?m.preco*fator:m.preco}});
      const porF={};h.forEach(m=>porF[m.nome.trim()]=(porF[m.nome.trim()]||0)+m.valor);
      const ofs=Object.entries(porF).filter(([n])=>!SG.ehAjudante(n)).sort((a,b)=>b[1]-a[1]);
      const ajs=Object.entries(porF).filter(([n])=>SG.ehAjudante(n)).sort((a,b)=>b[1]-a[1]);
      const tot=vh+vo;
      if(ofs.length){of=ofs[0][0];aj=ajs.length?ajs[0][0]:null;pct=tot>0?(ofs.reduce((a,x)=>a+x[1],0)+vo)/tot*100:100}
      else if(ajs.length){of=ajs[0][0];aj=null;pct=100}
      else if(vo>0){pct=100}
      g.cod=c.cod;
    }else if(s){g.mo=cru?s.mo*fator:s.mo;mat=s.mat;g.cod=s.cod;origem='curva ABC de serviços'}
    else if(g.moU!=null){g.mo=cru?g.moU*fator:g.moU;mat=g.matU||0;origem='orçamento analítico'}
    else {g.mo=0;mat=g.pu||0;origem='só orçamento sintético';}
    if(!g.cod&&s)g.cod=s.cod;
    const flags=[];
    if(g.mo<=0)flags.push('sem MO');
    if(!g.qtd)flags.push('sem quantidade');
    if(!c)flags.push('sem composição');
    return {sel:!(g.mo<=0&&mat<=0),cod:g.cod||'',nome:g.desc.trim(),un:g.un,qtd:Math.round(g.qtd*10000)/10000,mo:Math.round(g.mo*10000)/10000,mat:Math.round(mat*10000)/10000,ofNome:of,ajNome:aj,pct:pct==null?null:Math.round(pct*10)/10,linhas:g.linhas,etapas:[...g.etapas],origem,flags};
  });
  const porGrupo={};lista.forEach(it=>{if(it.grupo)(porGrupo[it.grupo]=porGrupo[it.grupo]||[]).push(it)});
  Object.entries(porGrupo).forEach(([gr,arr])=>{for(let i=0;i<arr.length;i++)for(let j=0;j<arr.length;j++){const A=arr[i],B=arr[j];
    if(i===j||SG.norm(A.un)!==SG.norm(B.un)||!(B.qtd>0))continue;const r=A.qtd/B.qtd;
    if([10,100,1000].some(f=>Math.abs(r-f)/f<0.002)){const it=res.find(x=>SG.key(x.nome,x.un)===SG.key(A.desc,A.un));if(it&&!it.flags.includes('conferir quantidade'))it.flags.push('conferir quantidade');
      avisos.push(`Etapa "${gr.trim()}": "${A.desc.trim().slice(0,60)}" tem ${F2.format(A.qtd)} ${A.un}, exatamente ${Math.round(r)} vezes "${B.desc.trim().slice(0,60)}" (${F2.format(B.qtd)} ${B.un}). Pode ser vírgula no lugar errado no orçamento.`)}}});
  res.forEach(x=>{if(SG.norm(x.un)==='vb'){x.sel=false;x.flags.push('verba (não é produção)')}});
  if(cru)avisos.push(`Os relatórios vieram sem encargos sociais. A mão de obra horária foi convertida com os ${F1.format(o.enc)}% de encargos desta obra, para o teto sair certo.`);
  if(!R.comp&&base)avisos.push('Sem o relatório de Composições, a função de quem executa e a divisão oficial/ajudante são estimadas pelo nome do serviço.');
  return {itens:res,funcs:Object.values(funcs),avisos,cru,pctRel,tipos:Object.keys(R),obra:(Object.values(R)[0]||{}).obra||''};
};

let IMP=null;
async function lerArquivos(files){
  files=[...files].filter(f=>/\.xlsx?$/i.test(f.name));
  if(!files.length){toast('Envie arquivos .xlsx exportados do Sienge');return}
  if(!window.XLSX){toast('O leitor de Excel não carregou. Verifique a internet.');return}
  const rels=[],ignorados=[];
  for(const f of files){
    try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
      const ref=XLSX.utils.decode_range(ws['!ref']||'A1');
      let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true,blankrows:true});
      if(ref.s.c>0)rows=rows.map(r=>Array(ref.s.c).fill(null).concat(r));
      if(ref.s.r>0)rows=Array.from({length:ref.s.r},()=>[]).concat(rows);
      const p=SG.parse(rows);if(p.tipo){p.arquivo=f.name;rels.push(p)}else ignorados.push(f.name);
    }catch(e){ignorados.push(f.name)}
  }
  if(!rels.length){toast('Não reconheci esses arquivos como relatórios do Sienge');return}
  IMP=SG.montar(rels,O());IMP.arquivos=rels.map(r=>[r.arquivo,r.tipo]);IMP.ignorados=ignorados;render();
}

function aplicarImport(){
  const o=O(), I=IMP; if(!o||!I)return;
  const modo=document.getElementById('impModo').value, fnBox=document.getElementById('impFn'), attFn=fnBox?fnBox.checked:false;
  if(modo==='sub'&&o.medicoes.length&&!confirm('Substituir a tabela desliga as medições já lançadas dos serviços antigos. Continuar?'))return;
  const r4=v=>Math.round(v*10000)/10000;
  I.funcs.forEach(f=>{const ex=o.funcoes.find(x=>SG.norm(x.nome)===SG.norm(f.nome));if(ex){if(attFn)ex.hora=r4(f.hora)}else o.funcoes.push({id:uid(),nome:f.nome,hora:r4(f.hora)})});
  const fid=n=>{if(!n)return '';const f=o.funcoes.find(x=>SG.norm(x.nome)===SG.norm(n));return f?f.id:''};
  if(modo==='sub')o.servicos=[];
  let novos=0,atu=0;
  I.itens.filter(x=>x.sel).forEach(x=>{
    const g=adivinhaFn(o,x.nome);
    const of=fid(x.ofNome)||g.of, aj=x.ofNome?fid(x.ajNome):(x.pct===100?'':g.aj);
    const ex=o.servicos.find(s=>(x.cod&&s.cod&&String(s.cod)===String(x.cod)&&SG.norm(s.un)===SG.norm(x.un))||SG.key(s.nome,s.un)===SG.key(x.nome,x.un));
    if(ex){ex.qtd=x.qtd;ex.mo=x.mo;ex.mat=x.mat;if(!ex.cod)ex.cod=x.cod;atu++}
    else{o.servicos.push({id:uid(),cod:x.cod,nome:x.nome,un:x.un,qtd:x.qtd,mo:x.mo,mat:x.mat,of,aj,pct:x.pct,auto:false});novos++}
  });
  if(I.pctRel&&Math.abs(I.pctRel-o.enc)>0.01)o.enc=I.pctRel;
  if(/^nova obra$/i.test(o.nome.trim())&&I.obra)o.nome=I.obra;
  IMP=null;persist(o.id);tab='precos';render();
  toast(`${novos} serviço(s) novo(s) e ${atu} atualizado(s)`);
}

/* ---------- ações ---------- */
function copiar(txt,okMsg){
  const fallback=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();toast(ok?okMsg:'Não foi possível copiar automaticamente')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(okMsg),fallback);else fallback();
}
function importar(texto,modo){
  const o=O();
  const map=new Map(); let lidas=0, avisos=0;
  texto.split(/\r?\n/).forEach(linha=>{
    if(!linha.trim())return;
    const c=linha.split(linha.includes('\t')?'\t':';').map(x=>x.trim());
    if(c.length<5)return;
    const qtd=num(c[3]); if(!/\d/.test(c[3]||''))return;
    const cod=c[0], nome=c[1], un=c[2], mo=num(c[4]), mat=c[5]!=null&&c[5]!==''?num(c[5]):0, pct=c[6]!=null&&c[6]!==''?num(c[6]):null;
    const key=(cod||'')+'|'+(cod?'':nome.toLowerCase()+'|'+un);
    lidas++;
    if(map.has(key)){const s=map.get(key);s.qtd+=qtd;if(Math.abs(s.mo-mo)>1e-6)avisos++}
    else map.set(key,Object.assign({id:uid(),cod,nome,un,qtd,mo,mat,pct:pct,auto:true},adivinhaFn(o,nome)));
  });
  if(!lidas){toast('Nenhuma linha válida. Confira a ordem das colunas.');return}
  if(modo==='sub'){if(o.medicoes.length&&!confirm('Substituir a tabela apaga a ligação das medições já lançadas com os serviços. Continuar?'))return;o.servicos=[]}
  map.forEach(s=>{
    const ex=modo==='add'&&o.servicos.find(x=>(s.cod&&x.cod===s.cod)||(!s.cod&&x.nome===s.nome&&x.un===s.un));
    if(ex)ex.qtd=num(ex.qtd)+s.qtd;else o.servicos.push(s);
  });
  persist(o.id); tab='precos'; render();
  toast(`${lidas} linha(s) lidas, ${map.size} serviço(s)${avisos?` · ${avisos} com MO diferente entre linhas (ficou a primeira)`:''}`);
}
function resumoMed(o,m){
  const r=calcMed(o,m);
  let t=`${o.nome} — ${m.periodo||'Medição'}${m.data?' ('+m.data.split('-').reverse().join('/')+')':''}\n\n`;
  r.linhas.forEach(x=>{if(x.s)t+=`${x.s.nome}: ${m2(x.q)} ${x.s.un} × ${m2(x.c.preco)} = ${brl(x.valor)}\n`});
  t+=`\nPagamento por funcionário\n`;
  r.lista.forEach(p=>{t+=o.regime==='clt'
    ?`${p.nome} (${p.funcao}): produção ${brl(p.prod)}, salário ${brl(p.sal)}, bonificação a pagar ${brl(p.pagar)} (retido ${brl(p.ret)})\n`
    :`${p.nome}: produção ${brl(p.prod)}, a pagar ${brl(p.prod*(1-o.ret/100))}\n`});
  t+=`\nMO orçada medida ${brl(r.moOrc)} · custo real ${brl(r.custo)} · ${F0.format(r.ratio*100)}%`;
  return t;
}
