  if(a==='impTodos'||a==='impNenhum'){if(IMP)IMP.itens.forEach(x=>x.sel=a==='impTodos');render();return}
  if(a==='impAplicar'){aplicarImport();return}
  if(a==='tema'){const ord=['auto','light','dark'],n=ord[(ord.indexOf(temaAtual())+1)%3];try{localStorage.setItem(TKEY,n)}catch(e){}aplicaTema();render();toast('Tema: '+TEMAS[n][0]);return}
  if(a==='limparFiltro'){FL.q='';FL.cls='';FL.fn='';FL.sit='';render();return}
  const mtx=b.dataset.id&&O()&&(O().metas||[]).find(x=>x.id===b.dataset.id);
  if(a==='novaMeta'){novaMetaAberta=true;metaFiltro='';render();const n=document.getElementById('nmNome');if(n)n.focus();return}
  if(a==='fecharNovaMeta'){novaMetaAberta=false;render();return}
  if(a==='criarMeta'){const o=O();const nome=(document.getElementById('nmNome').value||'').trim()||`Setor ${o.metas.length+1}`;const ini=document.getElementById('nmIni').value||hoje();const pz=document.getElementById('nmPrazo').value||new Date(Date.now()+14*864e5).toISOString().slice(0,10);const id=uid();o.metas.push({id,criado:Date.now(),nome,inicio:ini,prazo:pz,entrega:'',premio:null,linhas:[{sid:o.servicos[0]?o.servicos[0].id:'',qtd:0}],equipe:{},crit:{},encerrada:false});metasAbertas.add(id);novaMetaAberta=false;persist(o.id);render();toast('Meta criada');return}
  if(a==='metaToggle'){const id=b.dataset.id;metasAbertas.has(id)?metasAbertas.delete(id):metasAbertas.add(id);render();return}
  if(a==='metaFiltro'){metaFiltro=metaFiltro===b.dataset.v?'':b.dataset.v;render();return}
  if(a==='medPick'){medSel=b.dataset.v;render();return}
  if(a==='addMetaLinha'&&mtx){const ult=mtx.linhas[mtx.linhas.length-1];mtx.linhas.push({sid:ult?ult.sid:O().servicos[0].id,qtd:0});persist(O().id);render();return}
  if(a==='delMetaLinha'&&mtx){mtx.linhas.splice(+b.dataset.i,1);persist(O().id);render();return}
  if(a==='delMeta'&&mtx){if(!confirm('Excluir esta meta?'))return;O().metas=O().metas.filter(x=>x!==mtx);persist(O().id);render();return}
  if(a==='encMeta'&&mtx){mtx.encerrada=!mtx.encerrada;persist(O().id);render();toast(mtx.encerrada?'Meta encerrada':'Meta reaberta');return}
  if(a==='copiarMeta'&&mtx){copiar(resumoMeta(O(),mtx),'Resumo copiado');return}
  if(a==='abrirObra'){S.atual=b.dataset.id;try{localStorage.setItem('calcProducaoAtual',S.atual)}catch(x){}medSel=null;tab='precos';render();return}
  if(a==='abrirMed'){S.atual=b.dataset.id;medSel=null;tab='medicao';render();return}
  if(a==='detalhes'){detalhes=!detalhes;render();return}
  if(a==='novaObra'){const n=prompt('Nome da obra','Nova obra');if(n===null)return;const x=novaObra(n.trim()||'Nova obra');S.obras[x.id]=x;S.atual=x.id;tab='precos';persist(x.id);render();return}
  if(!o)return;
  if(a==='dupObra'){cfgAberto=false;const x=JSON.parse(JSON.stringify(o));x.id=uid();x.nome=o.nome+' (cópia)';x.medicoes=[];S.obras[x.id]=x;S.atual=x.id;persist(x.id);render();toast('Obra duplicada sem as medições');return}
  if(a==='delObra'){cfgAberto=false;if(!confirm(`Excluir a obra "${o.nome}" com todas as medições? Isso não pode ser desfeito.`))return;const id=o.id;delete S.obras[id];S.atual=Object.keys(S.obras)[0]||null;persist(id);render();return}
  if(a==='addRapido'){const nome=document.getElementById('qNome').value.trim();if(!nome){toast('Escreva o nome do serviço');document.getElementById('qNome').focus();return}
    o.servicos.push(Object.assign({id:uid(),cod:'',nome,un:document.getElementById('qUn').value.trim()||'un',qtd:num(document.getElementById('qQtd').value),mo:num(document.getElementById('qMo').value),mat:0,pct:null,auto:true},adivinhaFn(o,nome)));
    persist(o.id);render();const q=document.getElementById('qNome');if(q)q.focus();toast('Serviço adicionado');return}
  if(a==='delServ'){const s=o.servicos.find(x=>x.id===b.dataset.id);if(medidoAcum(o,s.id,null)>0&&!confirm('Este serviço já tem medições. Excluir mesmo assim?'))return;o.servicos=o.servicos.filter(x=>x.id!==b.dataset.id);persist(o.id);render();return}
  if(a==='copiarTabela'){let t='Código\tServiço\tUn\tQtd orçada\tMO orçada\tTeto\tPreço tabela\tOficial\tAjudante\tVerba teto\n';o.servicos.forEach(s=>{const c=calc(o,s);t+=[s.cod,s.nome,s.un,m2(num(s.qtd)),m4(num(s.mo)),m2(c.teto),m2(c.preco),m2(c.pOf),m2(c.pAj),m2(c.verba)].join('\t')+'\n'});copiar(t,'Tabela copiada. Cole no Excel.');return}
  if(a==='novaMed'){const n=o.medicoes.length+1;const m={id:uid(),criado:Date.now(),periodo:`Medição ${n}`,data:new Date().toISOString().slice(0,10),linhas:[{sid:o.servicos[0]?o.servicos[0].id:'',qtd:0,of:'',aj:''}],diasPadrao:o.diasPadrao,dias:{},fechada:false};o.medicoes.push(m);medSel=m.id;tab='medicao';persist(o.id);render();return}
  const m=o.medicoes.find(x=>x.id===medSel);
  if(a==='addLinha'&&m){const ult=m.linhas[m.linhas.length-1];m.linhas.push({sid:ult?ult.sid:o.servicos[0].id,qtd:0,of:ult?ult.of:'',aj:ult?ult.aj:''});persist(o.id);render();const ss=document.querySelectorAll('select[data-k="sid"][data-ml]');if(ss.length)ss[ss.length-1].focus();return}
  if(a==='delLinha'&&m){m.linhas.splice(+b.dataset.i,1);persist(o.id);render();return}
  if(a==='fecharMed'&&m){m.fechada=!m.fechada;persist(o.id);render();toast(m.fechada?'Medição fechada':'Medição reaberta');return}
  if(a==='delMed'&&m){if(!confirm('Excluir esta medição?'))return;o.medicoes=o.medicoes.filter(x=>x.id!==m.id);medSel=null;persist(o.id);render();return}
  if(a==='copiarMed'&&m){copiar(resumoMed(o,m),'Resumo copiado');return}
  if(a==='addFn'){o.funcoes.push({id:uid(),nome:'Nova função',hora:0});persist(o.id);render();const fs2=document.querySelectorAll('input.fn-nome');if(fs2.length){fs2[fs2.length-1].focus();fs2[fs2.length-1].select()}return}
  if(a==='delFn'){const id=b.dataset.id;if(o.servicos.some(s=>s.of===id||s.aj===id)||o.funcionarios.some(p=>p.funcao===id)){toast('Essa função está em uso por serviços ou funcionários');return}o.funcoes=o.funcoes.filter(f=>f.id!==id);persist(o.id);render();return}
  if(a==='addFu'){addFuAberto=!addFuAberto;render();if(addFuAberto){const n=document.getElementById('fuNome');if(n)n.focus()}return}
  if(a==='criarFu'){const o=O();const nome=(document.getElementById('fuNome').value||'').trim();if(!nome){toast('Escreva o nome do funcionário');document.getElementById('fuNome').focus();return}
    const c=document.getElementById('fuCpf');o.funcionarios.push({id:uid(),nome,funcao:document.getElementById('fuFuncao').value,...(c&&c.value.trim()?{cpf:c.value.trim()}:{})});persist(o.id);render();const n=document.getElementById('fuNome');if(n)n.focus();toast(nome+' adicionado');return}
  if(a==='limparObraBusca'){obraBusca='';render();return}
  if(a==='addUserForm'){addUserAberto=!addUserAberto;render();if(addUserAberto){const n=document.getElementById('uEmail');if(n)n.focus()}return}
  if(a==='delFu'){if(!confirm('Remover este funcionário da obra?'))return;o.funcionarios=o.funcionarios.filter(p=>p.id!==b.dataset.id);persist(o.id);render();return}
  if(a==='importar'){importar(document.getElementById('txtImp').value,b.dataset.v);return}
  if(a==='gerarBkp'){const t=JSON.stringify(o);document.getElementById('txtBkp').value=t;copiar(t,'Backup gerado e copiado');return}
  if(a==='restaurar'){try{const x=JSON.parse(document.getElementById('txtBkp').value);if(!x.servicos||!x.funcoes)throw 0;x.id=uid();x.nome=Object.values(S.obras).some(y=>y.nome===x.nome)?(x.nome||'Obra')+' (restaurada)':(x.nome||'Obra');normaliza(x);S.obras[x.id]=x;S.atual=x.id;persist(x.id);tab='precos';render();toast('Obra restaurada')}catch(err){toast('O texto colado não é um backup válido desta calculadora')}return}
});

document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset, o=O();
  if(t.id==='impFiles'){lerArquivos(t.files);return}
  if(d.imp!==undefined&&IMP){IMP.itens[+d.imp].sel=t.checked;render();return}
  const neg=CAMPO_PERM.find(([k,p])=>d[k]!==undefined&&!can(p));if(neg){toast('Seu perfil não tem permissão para isso');render();return}
  if(d.us){const v=d.k==='ativo'?t.checked:t.value;fs.collection(USUARIOS).doc(d.us).set({[d.k]:v},{merge:true}).catch(err=>toast('Erro: '+err.code));return}
  if(d.uo){const [em,oid]=d.uo.split('|');const u=USERS.find(x=>x.email===em);const sel=new Set((u&&u.obras)||[]);t.checked?sel.add(oid):sel.delete(oid);
    fs.collection(USUARIOS).doc(em).set({obras:[...sel]},{merge:true}).catch(err=>toast('Erro: '+err.code));return}
  if(d.flt&&d.flt!=='q'&&d.flt!=='obra'){FL[d.flt]=t.value;render();return}
  if(d.act==='obra'){FL.fn='';S.atual=t.value;medSel=null;try{localStorage.setItem('calcProducaoAtual',S.atual)}catch(x){}render();return}
  if(d.act==='medSel'){medSel=t.value;render();return}
  if(d.act==='abcBase'){abcBase=t.value;render();return}
  if(!o)return;
  const numK=['qtd','mo','mat','pct','hora'];
  if(d.p){o[d.p]=['nome','regime','modelo'].includes(d.p)?t.value:num(t.value);if(d.p==='modelo'&&tab==='medicao'&&t.value==='meta')tab='metas';if(d.p==='modelo'&&tab==='metas'&&t.value==='producao')tab='precos';persist(o.id);setTimeout(render,0);return}
  if(d.pe){o.pesos[d.pe]=num(t.value);persist(o.id);render();return}
  if(d.mt){const mt=o.metas.find(x=>x.id===d.mt);mt[d.k]=d.k==='premio'?(t.value.trim()?num(t.value):null):t.value;if(d.k==='entrega'&&mt.crit)delete mt.crit.prazo;persist(o.id);render();return}
  if(d.mtl){const [mid,i]=d.mtl.split('|');const l=o.metas.find(x=>x.id===mid).linhas[+i];l[d.k]=d.k==='qtd'?num(t.value):t.value;persist(o.id);render();return}
  if(d.mte){const [mid,fid]=d.mte.split('|');const mt=o.metas.find(x=>x.id===mid);mt.equipe=mt.equipe||{};if(t.checked)mt.equipe[fid]=mt.inicio&&mt.prazo?Math.max(1,diasEntre(mt.inicio,mt.prazo)):1;else delete mt.equipe[fid];persist(o.id);render();return}
  if(d.mtd){const [mid,fid]=d.mtd.split('|');o.metas.find(x=>x.id===mid).equipe[fid]=num(t.value);persist(o.id);render();return}
  if(d.mtc){const [mid,k]=d.mtc.split('|');const mt=o.metas.find(x=>x.id===mid);mt.crit=mt.crit||{};mt.crit[k]=t.checked;persist(o.id);render();return}
  if(d.s){const s=o.servicos.find(x=>x.id===d.s);s[d.k]=d.k==='pct'&&!t.value.trim()?null:numK.includes(d.k)?num(t.value):t.value;if(d.k==='nome'&&s.auto){Object.assign(s,adivinhaFn(o,s.nome))}persist(o.id);render();return}
  if(d.fn){const f=o.funcoes.find(x=>x.id===d.fn);f[d.k]=numK.includes(d.k)?num(t.value):t.value;persist(o.id);render();return}
  if(d.fu){const p=o.funcionarios.find(x=>x.id===d.fu);p[d.k]=t.value;persist(o.id);render();return}
  if(d.m){const m=o.medicoes.find(x=>x.id===d.m);m[d.k]=d.k==='diasPadrao'?num(t.value):t.value;persist(o.id);render();return}
  if(d.ml){const [mid,i]=d.ml.split('|');const l=o.medicoes.find(x=>x.id===mid).linhas[+i];l[d.k]=d.k==='qtd'?num(t.value):t.value;persist(o.id);render();return}
  if(d.md){const [mid,fid]=d.md.split('|');const m=o.medicoes.find(x=>x.id===mid);(m.dias=m.dias||{})[fid]=num(t.value);persist(o.id);render();return}
});

let tBusca;
document.addEventListener('input',e=>{
  const t=e.target; const kf=t.dataset.flt; if(kf!=='q'&&kf!=='obra')return;
  if(kf==='q')FL.q=t.value; else obraBusca=t.value; clearTimeout(tBusca);
  tBusca=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},180);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(cfgAberto){cfgAberto=false;render();return}const m=document.querySelector('details.menu[open]');if(m)m.open=false}
  if(e.key==='Enter'&&(e.target.id==='lEmail'||e.target.id==='lSenha')){e.preventDefault();const b=document.querySelector('[data-act="entrar"]');if(b)b.click();return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('.uform')){e.preventDefault();const b=document.querySelector('[data-act="addUser"]');if(b)b.click();return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('.quick')){e.preventDefault();const b=document.querySelector('.quick [data-act="addRapido"], .quick [data-act="criarMeta"], .quick [data-act="criarFu"], .quick [data-act="addUser"]');if(b)b.click()}});
render(); iniciar();
})();
</script>
